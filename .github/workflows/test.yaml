name: "🧪 Test"
on:
  push:
    branches:
      - "main"
  pull_request:

jobs:
  test:
    name: "${{ matrix.name }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Test"
            runner: "ubuntu-latest"
            cpythons:
              - "3.13"
            tox-environments:
              - "mypy"
              - "build_doc_bundle"
            cache-paths:
              - ".mypy_cache/"
    uses: 'globus/workflows/.github/workflows/tox.yaml@9cb0a9d3c117062037aefaaa816116e9db1f241f' # v1.4
    with:
      config: "${{ toJSON(matrix) }}"
