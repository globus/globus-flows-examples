ci:
  autoupdate_schedule: quarterly

repos:
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes

  - repo: "https://github.com/pre-commit/pre-commit-hooks"
    rev: '3e8a8703264a2f4a69428a0aa4dcb512790b2c8c'  # frozen: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-json
      - id: pretty-format-json
        args: ["--autofix", "--no-sort-keys", "--no-ensure-ascii"]

  - repo: "https://github.com/codespell-project/codespell"
    rev: '57b21406f092110c18776e39b0bda50d37c945c8'  # frozen: v2.4.3
    hooks:
      - id: codespell
        args: ["--ignore-regex", "https://[^\\s]*"]

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: '4f85d46a92dc17713078e5de73f8a13190edf6fc'  # frozen: 0.38.2
    hooks:
      - id: check-github-workflows
      - id: check-jsonschema
        args: ["--schemafile", "support/doc_config_schema.json"]
        files: "\\.doc_config\\.yaml"
        types: [yaml]

  - repo: "https://github.com/sirosen/texthooks"
    rev: '815307a61a62d48c84412f34f3e6789a2cd9179a'  # frozen: 0.7.1
    hooks:
      - id: alphabetize-codeowners

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: '96ae3e5802f3fe2d551e703e18f0a367d1a81ac2'  # frozen: 26.10.0
    hooks:
      - id: black

  - repo: https://github.com/PyCQA/flake8
    rev: 'cfbbfdeb2391c14a37e101e92a77f54f329e1726'  # frozen: 7.4.1
    hooks:
      - id: flake8
        additional_dependencies:
          - 'flake8-bugbear==25.11.29'
          - 'flake8-comprehensions==3.17.0'
          - 'flake8-typing-as-t==1.1.0'
